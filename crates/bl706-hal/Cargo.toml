[package]
name = "bl706-hal"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Experimental BL706 RAM bring-up HAL and Embassy integration"

[dependencies]
bl706-pac = { version = "0.1.0", path = "../bl706-pac" }
critical-section = { version = "1.2.0", features = ["restore-state-bool"] }
embassy-executor = { version = "0.10.0", default-features = false }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }
embassy-time-driver = "0.2.2"
embassy-time-queue-utils = { version = "0.3.2", features = ["generic-queue-8"] }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-storage = "0.3.2"
embedded-storage-async = "0.4.2"
portable-atomic = { version = "1.15.0", features = ["critical-section"] }

[features]
default = []
fpu = []
flash = []
