name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PAC, rustfmt, clippy and firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Install the pinned Rust toolchain and components
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build the pinned PAC generator
        run: |
          git init "$RUNNER_TEMP/chiptool"
          git -C "$RUNNER_TEMP/chiptool" remote add origin https://github.com/embassy-rs/chiptool
          git -C "$RUNNER_TEMP/chiptool" fetch --depth 1 origin bcf538a2e7b8584ae874ee9ab72efb1576fc6152
          git -C "$RUNNER_TEMP/chiptool" checkout --detach FETCH_HEAD
          cp tools/chiptool.Cargo.lock "$RUNNER_TEMP/chiptool/Cargo.lock"
          host_target=$(rustc -vV | awk '/^host:/ {print $2}')
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/chiptool/Cargo.toml" --target "$host_target"
          echo "CHIPTOOL=$RUNNER_TEMP/chiptool/target/$host_target/release/chiptool" >> "$GITHUB_ENV"

      - name: Regenerate PAC, run host tests, build and lint IMC/IMFC
        env:
          BL706_DIAGNOSTICS: ${{ runner.temp }}/bl706-checks
        run: bash tools/check.sh
